name: Publish to npm

# Builds SuperCI for every system it ships for, tries it, and publishes the npm packages: the program for each system
# first, the launcher `@superci/cli` last. npm trusts this workflow (trusted publishing): there is no token to keep. Each
# package names it on npmjs.com (Settings, Trusted publisher: supercorp-ai/superci, publish.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release; must be the one this commit carries
        required: true
        type: string
      dry_run:
        description: Build and try everything, publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  trust:
    # Before the long build: npm is asked whether it trusts this workflow for each package (the exchange a publish
    # starts with). What it answers is said; the short-lived token it gives is thrown away.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Ask npm about each package
        run: |
          id=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$id" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{repository, repository_id, repository_owner, repository_owner_id, repository_visibility, workflow_ref, ref, event_name, runner_environment}'
          failed=0
          for package in $(jq -r '.targets[].package' npm/targets.json) $(jq -r .name npm/package.json); do
            answer=$(curl -sS -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $id" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$(echo "$package" | sed 's|/|%2f|')")
            if [ "$answer" = "201" ] || [ "$answer" = "200" ]; then echo "$package: trusted"; else echo "$package: $answer $(jq -c 'del(.token)' "$RUNNER_TEMP/answer.json" 2>/dev/null)"; failed=1; fi
          done
          [ "$failed" = 0 ] || { echo "npm does not trust this workflow for every package: set each one's Trusted publisher on npmjs.com (supercorp-ai/superci, publish.yml, Allow npm publish)." >&2; exit 1; }

  build:
    # A Mac builds them all: its own two, and Linux's and Windows' through zig.
    needs: trust
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Require the requested version to be the one this commit carries
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          carried=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$carried" = "$RELEASE_VERSION" ] || { echo "This commit carries $carried, and $RELEASE_VERSION was asked for." >&2; exit 1; }
          grep -q "^## $RELEASE_VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $RELEASE_VERSION." >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: The build's tools (zig, cargo-zigbuild, worker-build)
        run: |
          brew install zig
          cargo install --locked cargo-zigbuild worker-build
      - name: Build everything and pack the npm packages
        run: ./scripts/npm-pack.sh
      - name: The tests
        run: cargo test --workspace
      - name: Try what was packed, through npx
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/target/npm/superci-cli-darwin-arm64-*.tgz "$GITHUB_WORKSPACE"/target/npm/superci-cli-[0-9]*.tgz
          [ "$(npx superci --version)" = "superci $RELEASE_VERSION" ]
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: target/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: The crates pack and build as crates.io would get them
        run: ./scripts/crates-publish.sh --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: embedded
          path: crates/cli/embedded/
          if-no-files-found: error
          retention-days: 7

  windows:
    # The package for Windows, on Windows: installed as npm would, asked its version, and its dashboard opened.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm
      - name: Try what was packed, through npx
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir try && cd try && npm init -y > /dev/null
          npm install ../npm/superci-cli-win32-x64-*.tgz ../npm/superci-cli-[0-9]*.tgz
          [ "$(npx superci --version | tr -d '\r')" = "superci $RELEASE_VERSION" ]
          npx superci dashboard --no-browser > out.txt 2>&1 &
          for i in $(seq 1 30); do grep -q 'http://localhost' out.txt && break; sleep 1; done
          cat out.txt
          link=$(grep -o 'http://localhost[^ ]*' out.txt | head -1 | tr -d '\r')
          [ -n "$link" ]
          curl -sS --max-time 20 -o page.html -w '%{http_code}\n' -L -c jar -b jar "$link" | tee code.txt
          [ "$(tail -1 code.txt | tr -d '\r')" = "200" ]
          grep -q 'SuperCI' page.html

  publish:
    needs: [build, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: target/npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Publish (each program, then the launcher once every program's file downloads; what is on npm already is passed by)
        run: ./scripts/npm-publish.sh
      - name: Tag this commit and publish the release with its notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          awk -v v="## $RELEASE_VERSION " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  crates:
    # `cargo install superci`: the same source, with what the build job built inside it. crates.io trusts this
    # workflow (trusted publishing, set on each crate's page: Settings, Trusted Publishing, supercorp-ai/superci,
    # publish.yml), so there is no token to keep. After npm: a failure here leaves npm's release whole, and running
    # the failed job again finishes it.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: embedded
          path: crates/cli/embedded
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: ./scripts/crates-publish.sh --embedded
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew:
    # `brew install supercorp-ai/tap/superci`: the tap's formula names npm's files for one version, each with its
    # checksum, so it is written again at each release. Needs the secret HOMEBREW_TAP_TOKEN (a token that may write
    # to supercorp-ai/homebrew-tap; this workflow's own token reaches only this repository). Without it this job
    # fails and says so: a tap left a release behind would install the old program without a word.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Point the tap at this release
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          [ -n "${TAP_TOKEN:-}" ] || { echo "HOMEBREW_TAP_TOKEN is not set: the tap still installs the release before. Add the secret and run this job again." >&2; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/supercorp-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          ./scripts/brew-formula.sh "$RELEASE_VERSION" > tap/Formula/superci.rb
          cd tap
          if git diff --quiet -- Formula/superci.rb && git ls-files --error-unmatch Formula/superci.rb > /dev/null 2>&1; then echo "The tap already installs $RELEASE_VERSION."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/superci.rb
          git commit -q -m "superci $RELEASE_VERSION"
          git push -q
      - name: Install from the tap and ask its version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap supercorp-ai/tap
          brew install supercorp-ai/tap/superci
          [ "$(superci --version)" = "superci $RELEASE_VERSION" ]

  installer:
    # `curl -fsSL https://superci.dev/install.sh | sh`: the installer as this commit has it installs this release.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          SUPERCI_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          [ "$("$RUNNER_TEMP/bin/superci" --version)" = "superci $RELEASE_VERSION" ]
