name: Publish to npm

# Builds SuperCI for every system it ships for, tries it, and publishes the npm packages: the program for each system
# first, the launcher `@superci/cli` last. npm trusts this workflow (trusted publishing): there is no token to keep. Each
# package names it on npmjs.com (Settings, Trusted publisher: supercorp-ai/superci, publish.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release; must be the one this commit carries
        required: true
        type: string
      dry_run:
        description: Build and try everything, publish nothing
        type: boolean
        default: false

permissions:
  contents: read
  # (Whether the Test workflow passed for this commit already: its tests are not run twice.)
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  trust:
    # Before the long build: npm is asked whether it trusts this workflow for each package (the exchange a publish
    # starts with). What it answers is said; the short-lived token it gives is thrown away.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Ask npm about each package
        run: |
          id=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$id" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{repository, repository_id, repository_owner, repository_owner_id, repository_visibility, workflow_ref, ref, event_name, runner_environment}'
          failed=0
          for package in $(jq -r '.targets[].package' npm/targets.json) $(jq -r .name npm/package.json); do
            answer=$(curl -sS -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $id" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$(echo "$package" | sed 's|/|%2f|')")
            if [ "$answer" = "201" ] || [ "$answer" = "200" ]; then echo "$package: trusted"; else echo "$package: $answer $(jq -c 'del(.token)' "$RUNNER_TEMP/answer.json" 2>/dev/null)"; failed=1; fi
          done
          [ "$failed" = 0 ] || { echo "npm does not trust this workflow for every package: set each one's Trusted publisher on npmjs.com (supercorp-ai/superci, publish.yml, Allow npm publish)." >&2; exit 1; }
      - name: The pinned images passed the live image check
        # (scripts/image-check.sh writes what it passed on into scripts/image-check.passed: a release moves no pin that
        # no job has booted.)
        run: |
          pinned=$(sed -n 's/^pub const IMAGE_RELEASE: &str = "\(.*\)";/\1/p' crates/core/src/aws.rs)
          grep -qx "$pinned" scripts/image-check.passed 2>/dev/null || { echo "The pinned image builds ($pinned) have not passed scripts/image-check.sh: run it on the release's build, and commit scripts/image-check.passed." >&2; exit 1; }
      - name: The pinned Linux images are still RunsOn's
        # A release boots the builds it pins (IMAGE_BUILDS in crates/core/src/aws.rs). RunsOn keeps only its last three
        # Linux builds: a pin among them moves only after scripts/image-check.sh passed on the new ones; one already
        # gone is a release that would ask its users to update, and update them to nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^pub const IMAGE_RELEASE: &str = "\(.*\)";/\1/p' crates/core/src/aws.rs)
          kept=$(gh release list -R runs-on/runner-images-for-aws --limit 30 --json tagName --jq '[.[].tagName | select(startswith("linux-"))][:3][]')
          echo "Pinned: linux-$pinned. RunsOn keeps: $(echo $kept)"
          echo "$kept" | grep -qx "linux-$pinned" || { echo "RunsOn no longer has the pinned Linux build (linux-$pinned). Move the pins (IMAGE_BUILDS, IMAGE_RELEASE) after scripts/image-check.sh passed on its newest builds." >&2; exit 1; }

  # What the program carries inside it (the control planes, the runner agent, the cache and layer store programs), built
  # once; then the program for each system on a machine of its own, side by side; then packed and tried.
  programs:
    needs: trust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Require the requested version to be the one this commit carries
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          carried=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$carried" = "$RELEASE_VERSION" ] || { echo "This commit carries $carried, and $RELEASE_VERSION was asked for." >&2; exit 1; }
          grep -q "^## $RELEASE_VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $RELEASE_VERSION." >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown
      # What was compiled before (dependencies above all), kept between releases: the same release build, sooner.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-programs
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: worker-build
        run: cargo install --locked worker-build@0.8.7
      - name: What the program carries
        run: SUPERCI_PROGRAMS_ONLY=1 ./build.sh
      # (Only a run that ran every test counts: the Test workflow's on a push to main, or Coverage's of every test. Test
      # on a pull request leaves the tests to Coverage, and passing there says nothing of them.)
      - name: Whether this commit's tests passed already
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test_push=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=test.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq length 2>/dev/null || echo 0)
          coverage=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=coverage.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length 2>/dev/null || echo 0)
          echo "passed=$([ "${test_push:-0}" -gt 0 ] || [ "${coverage:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: The tests
        if: steps.tested.outputs.passed != 'true'
        run: cargo test --workspace
      - name: The crates pack and build as crates.io would get them
        run: ./scripts/crates-publish.sh --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          retention-days: 7
          if-no-files-found: error
          path: |
            crates/plane-cloudflare/build
            crates/runners-cloudflare/build
            crates/plane-aws/build
            crates/plane-modal/build
            target/x86_64-unknown-linux-musl/release/superci-cache
            target/x86_64-unknown-linux-musl/release/superci-layers
            target/aarch64-unknown-linux-musl/release/superci-cache
            target/aarch64-unknown-linux-musl/release/superci-layers
            target/x86_64-pc-windows-gnu/release/superci-cache.exe
      - uses: actions/upload-artifact@v4
        with:
          name: embedded
          path: |
            crates/cli/embedded/
            crates/programs-*/embedded/
          if-no-files-found: error
          retention-days: 7

  cli:
    needs: programs
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, zig: false }
          - { target: x86_64-apple-darwin, os: macos-15, zig: false }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-gnu, os: ubuntu-latest, zig: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-${{ matrix.target }}
      # (After the Rust cache: what it restores of target/ would take the programs' place.)
      - uses: actions/download-artifact@v4
        with:
          name: programs
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: The program for ${{ matrix.target }}
        run: |
          if [ "${{ matrix.zig }}" = true ]; then cargo zigbuild --release --target ${{ matrix.target }} -p superci; else cargo build --release --target ${{ matrix.target }} -p superci; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/superci${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  pack:
    needs: cli
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
      - name: Pack the npm packages from each system's program
        run: |
          for d in bins/bin-*; do t=${d#bins/bin-}; mkdir -p "target/$t/release" && cp "$d"/* "target/$t/release/"; done
          chmod +x target/*/release/superci 2>/dev/null || true
          ./scripts/npm-pack.sh --no-build
      - name: Try what was packed, through npx
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/target/npm/superci-cli-darwin-arm64-*.tgz "$GITHUB_WORKSPACE"/target/npm/superci-cli-[0-9]*.tgz
          [ "$(npx superci --version)" = "superci $RELEASE_VERSION" ]
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: target/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows:
    # The package for Windows, on Windows: installed as npm would, asked its version, and its dashboard opened.
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm
      - name: Try what was packed, through npx
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir try && cd try && npm init -y > /dev/null
          npm install ../npm/superci-cli-win32-x64-*.tgz ../npm/superci-cli-[0-9]*.tgz
          [ "$(npx superci --version | tr -d '\r')" = "superci $RELEASE_VERSION" ]
          npx superci dashboard --no-browser > out.txt 2>&1 &
          for i in $(seq 1 30); do grep -q 'http://localhost' out.txt && break; sleep 1; done
          cat out.txt
          link=$(grep -o 'http://localhost[^ ]*' out.txt | head -1 | tr -d '\r')
          [ -n "$link" ]
          curl -sS --max-time 20 -o page.html -w '%{http_code}\n' -L -c jar -b jar "$link" | tee code.txt
          [ "$(tail -1 code.txt | tr -d '\r')" = "200" ]
          grep -q 'SuperCI' page.html

  publish:
    needs: [pack, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: target/npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Publish (each program, then the launcher once every program's file downloads; what is on npm already is passed by)
        run: ./scripts/npm-publish.sh
      - name: Tag this commit and publish the release with its notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          awk -v v="## $RELEASE_VERSION " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  crates:
    # `cargo install superci`: the same source, with what the build job built inside it (superci-programs-*).
    # crates.io trusts this workflow (trusted publishing, set on each crate's page: Settings, Trusted Publishing,
    # supercorp-ai/superci, publish.yml), so there is no token to keep. After npm: a failure here leaves npm's release whole, and running
    # the failed job again finishes it.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: embedded
          path: crates
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: ./scripts/crates-publish.sh --embedded
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew:
    # `brew install supercorp-ai/tap/superci`: the tap's formula names npm's files for one version, each with its
    # checksum, so it is written again at each release. Needs the secret HOMEBREW_TAP_TOKEN (a token that may write
    # to supercorp-ai/homebrew-tap; this workflow's own token reaches only this repository). Without it this job
    # fails and says so: a tap left a release behind would install the old program without a word.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Point the tap at this release
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          [ -n "${TAP_TOKEN:-}" ] || { echo "HOMEBREW_TAP_TOKEN is not set: the tap still installs the release before. Add the secret and run this job again." >&2; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/supercorp-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          ./scripts/brew-formula.sh "$RELEASE_VERSION" > tap/Formula/superci.rb
          cd tap
          if git diff --quiet -- Formula/superci.rb && git ls-files --error-unmatch Formula/superci.rb > /dev/null 2>&1; then echo "The tap already installs $RELEASE_VERSION."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/superci.rb
          git commit -q -m "superci $RELEASE_VERSION"
          git push -q
      - name: Install from the tap and ask its version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap supercorp-ai/tap
          brew install supercorp-ai/tap/superci
          [ "$(superci --version)" = "superci $RELEASE_VERSION" ]

  installer:
    # `curl -fsSL https://superci.dev/install.sh | sh`: the installer as this commit has it installs this release.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          SUPERCI_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          [ "$("$RUNNER_TEMP/bin/superci" --version)" = "superci $RELEASE_VERSION" ]
