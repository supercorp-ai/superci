name: Test

# Builds everything the program carries inside it and the program, and runs the tests, on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: The build's tools (cargo-zigbuild, worker-build)
        run: cargo install --locked cargo-zigbuild worker-build
      - name: Build
        run: ./build.sh
      - name: The tests
        run: cargo test --workspace
      - name: The program for Windows builds
        run: cargo zigbuild --release --target x86_64-pc-windows-gnu -p superci
