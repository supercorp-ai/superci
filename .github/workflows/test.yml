name: Test

# Builds everything the program carries inside it and the program, and runs the tests, on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # (The layers jobs, quick, cancel the rest of the run when they fail: see their last step. The tests job is the
  # last over, so its failure is left a failure.)
  actions: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # What `./build.sh` makes that the tests need (the program crates carry it): kept between runs while the sources it
  # is built from are the same, so a run that changes tests alone does not build it again (as the Coverage workflow).
  PROGRAMS: |
    crates/plane-cloudflare/build
    crates/runners-cloudflare/build
    crates/plane-aws/build
    crates/plane-modal/build
    target/x86_64-unknown-linux-musl/release/superci-cache
    target/x86_64-unknown-linux-musl/release/superci-layers
    target/aarch64-unknown-linux-musl/release/superci-cache
    target/aarch64-unknown-linux-musl/release/superci-layers
    target/x86_64-pc-windows-gnu/release/superci-cache.exe

jobs:
  # Everything built once: the programs the binary carries (kept between runs while their sources stay) and the tests,
  # compiled into one archive the test jobs run from without compiling again.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # What the program carries, built for the tests with quicker settings (a release ships with LTO and one codegen
    # unit, for small programs; the tests do not care how small).
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v6
      - id: key
        run: echo "programs=programs-2-${{ runner.os }}-${{ hashFiles('build.sh', 'Cargo.lock', 'Cargo.toml', 'scripts/mkfs-erofs/**', 'crates/core/src/**', 'crates/core/Cargo.toml', 'crates/plane-*/src/**', 'crates/plane-*/Cargo.toml', 'crates/plane-cloudflare/wrangler.toml', 'crates/runners-cloudflare/src/**', 'crates/runners-cloudflare/Cargo.toml', 'crates/runners-cloudflare/wrangler.toml', 'crates/cache/src/**', 'crates/cache/Cargo.toml', 'crates/layers/src/**', 'crates/layers/Cargo.toml', 'crates/layers/build.rs', 'crates/layers/assets/**', 'crates/layers/proto/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: programs
        with:
          path: ${{ env.PROGRAMS }}
          key: ${{ steps.key.outputs.programs }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # (No cache of Zig's own: one of 250 MB a run filled the repository's cache, and the Rust cache was evicted.)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      # (cargo-zigbuild built, downloaded; worker-build has no build to download: compiled once, then kept by the Rust
      # cache.)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-nextest
      - name: worker-build
        if: steps.programs.outputs.cache-hit != 'true'
        run: cargo install --locked worker-build
      - name: Build
        if: steps.programs.outputs.cache-hit != 'true'
        run: ./build.sh
      # (Kept at once: the Rust cache's own cleanup, at the job's end, takes what was built for other targets out of
      # target/.)
      - uses: actions/cache/save@v4
        if: steps.programs.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PROGRAMS }}
          key: ${{ steps.key.outputs.programs }}
      - name: The tests, compiled into one archive
        run: cargo nextest archive --workspace --archive-file tests.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: tests
          retention-days: 1
          path: |
            tests.tar.zst
            ${{ env.PROGRAMS }}

  # What a release needs, checked beside the tests (from the programs the build made): the program for Windows, the
  # crates as crates.io would get them, the installer.
  release-checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # (After the Rust cache: what it restores of target/ would take the programs' place.)
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: The program for Windows builds
        run: cargo zigbuild --release --target x86_64-pc-windows-gnu -p superci
      - name: The crates pack and build as crates.io would get them
        run: ./scripts/crates-publish.sh --dry-run
      - name: The installer installs the latest release
        run: |
          SUPERCI_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/superci" --version

  # The tests, in four parts side by side, run from the build's archive (unpacked where it was built, so the paths
  # compiled into the tests are where they were). Each sweep's scenario runs once here.
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: tests
      # (Public resolvers for the runner and Docker's containers and builds: GitHub's Ubuntu runners could not resolve
      # Ubuntu's archive through their own, 2026-11-11. Kept beside what the runner sets.)
      - name: Public resolvers
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved
          sudo mkdir -p /etc/docker && { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"dns": ["1.1.1.1", "8.8.8.8"]}' | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json && sudo systemctl restart docker
      # (The layer store's tests make EROFS files as the converter does, and serve them as root.)
      - name: mkfs.erofs
        run: sudo apt-get install -y -qq erofs-utils >/dev/null
      - name: Part ${{ matrix.part }} of the tests
        run: cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --partition count:${{ matrix.part }}/4 --no-fail-fast

  # Each sweep again with each of its calls and store operations failing in turn, and the core's control plane tests
  # likewise (in process): six machines side by side, each making every sweep's n-th fault from its own (a sweep can
  # take longer than all the others together, so its faults are shared out, not the sweeps).
  sweeps:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    env:
      SUPERCI_SWEEP_FAULTS: "1"
      SUPERCI_SWEEP_SLICE: ${{ matrix.part }}/6
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: tests
      # (Public resolvers for the runner and Docker's containers and builds: GitHub's Ubuntu runners could not resolve
      # Ubuntu's archive through their own, 2026-11-11. Kept beside what the runner sets.)
      - name: Public resolvers
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved
          sudo mkdir -p /etc/docker && { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"dns": ["1.1.1.1", "8.8.8.8"]}' | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json && sudo systemctl restart docker
      - name: Slice ${{ matrix.part }} of every sweep's faults
        run: cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-fail-fast -E 'binary(~sweep_) | test(~holds_with_each_call_and_store_operation_failing) | (package(superci-core) & binary(=plane) & test(every_test_here))'

  # superci-layers against containerd's own conformance suites for snapshotters and content stores (as root: the
  # snapshotter suite mounts overlays), directly and through containerd's metadata layer.
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: crates/layers/conformance/go.mod
          cache-dependency-path: crates/layers/conformance/go.sum
      - name: superci-layers
        run: cargo build -p superci-layers
      - name: containerd's suites
        working-directory: crates/layers/conformance
        run: |
          go test -c -o conformance.test .
          sudo SUPERCI_LAYERS="$GITHUB_WORKSPACE/target/debug/superci-layers" ./conformance.test -test.count=1 -test.v
      # One job failed: the rest of the run is cancelled, so a failure is known at once.
      - name: Stop the run
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Docker with superci-layers against Docker as it comes, on the machines' versions and the newest: the same work
  # both ways, the same results (crates/layers/e2e/docker.sh).
  layers-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - docker: 5:29.4.2-1~ubuntu.26.04~resolute
            containerd: 2.3.6-1~ubuntu.26.04~resolute
          - docker: 5:29.9.1-1~ubuntu.26.04~resolute
            containerd: 2.4.2-2~ubuntu.26.04~resolute
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: superci-layers
        run: cargo build -p superci-layers
      # (Public resolvers for the runner and Docker's containers and builds: GitHub's Ubuntu runners could not resolve
      # Ubuntu's archive through their own, 2026-11-11. Kept beside what the runner sets.)
      - name: Public resolvers
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved
          sudo mkdir -p /etc/docker && { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"dns": ["1.1.1.1", "8.8.8.8"]}' | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json && sudo systemctl restart docker
      - name: Docker ${{ matrix.docker }} with containerd ${{ matrix.containerd }}
        run: |
          docker build --progress=plain --build-arg DOCKER='${{ matrix.docker }}' --build-arg CONTAINERD='${{ matrix.containerd }}' -t e2e crates/layers/e2e
          docker volume create e2e-lib
          docker run --rm --privileged -e IMAGES=mirror.gcr.io/library -v "$PWD/target/debug/superci-layers:/superci-layers:ro" -v e2e-lib:/var/lib e2e
      # One job failed: the rest of the run is cancelled, so a failure is known at once.
      - name: Stop the run
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
