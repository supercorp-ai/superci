name: Coverage

# The tests, measured by supercov: lines, branches and MC/DC, each test's own. Run by hand (Actions → Coverage):
# every test; the browser suite alone (what the dashboard and control plane are covered by end to end, in Chrome); or
# the end-to-end suites (the browser's and the CLI's own, each driving the `superci` program), without unit tests.
# The browser suite and the end-to-end suites are measured in eight shards side by side (GitHub's runners are free for
# a public repository), their runs merged into one.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Every test, the browser suite alone, or the end-to-end suites (browser and CLI)
        type: choice
        options: [all, browser, e2e]
        default: all

permissions:
  contents: read

env:
  # What `./build.sh` makes that the tests need (the program crates carry it): kept between runs while the sources it
  # is built from are the same, so a run that changes tests alone does not build it again.
  PROGRAMS: |
    crates/plane-cloudflare/build
    crates/runners-cloudflare/build
    crates/plane-aws/build
    crates/plane-modal/build
    target/x86_64-unknown-linux-musl/release/superci-cache
    target/x86_64-unknown-linux-musl/release/superci-layers
    target/aarch64-unknown-linux-musl/release/superci-cache
    target/aarch64-unknown-linux-musl/release/superci-layers
    target/x86_64-pc-windows-gnu/release/superci-cache.exe

jobs:
  # The programs built (or kept from before); for the browser suite or every end-to-end suite, the tests listed and
  # dealt into eight shards.
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.deal.outputs.shards }}
      parts: ${{ steps.deal-all.outputs.parts }}
      programs: ${{ steps.key.outputs.programs }}
    steps:
      - uses: actions/checkout@v6
      # (What the programs are built from: the control planes, the runner agent, the cache program and the layer
      # store, with the core they share.)
      - id: key
        run: echo "programs=programs-2-${{ runner.os }}-${{ hashFiles('build.sh', 'Cargo.lock', 'Cargo.toml', 'scripts/mkfs-erofs/**', 'crates/core/src/**', 'crates/core/Cargo.toml', 'crates/plane-*/src/**', 'crates/plane-*/Cargo.toml', 'crates/plane-cloudflare/wrangler.toml', 'crates/runners-cloudflare/src/**', 'crates/runners-cloudflare/Cargo.toml', 'crates/runners-cloudflare/wrangler.toml', 'crates/cache/src/**', 'crates/cache/Cargo.toml', 'crates/layers/src/**', 'crates/layers/Cargo.toml', 'crates/layers/build.rs', 'crates/layers/assets/**', 'crates/layers/proto/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: programs
        with:
          path: ${{ env.PROGRAMS }}
          key: ${{ steps.key.outputs.programs }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.programs.outputs.cache-hit != 'true' && 'aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-prepare
      - uses: mlugg/setup-zig@v2
        if: steps.programs.outputs.cache-hit != 'true'
        with:
          version: 0.16.0
          use-cache: false
      - uses: taiki-e/install-action@v2
        if: steps.programs.outputs.cache-hit != 'true'
        with:
          tool: cargo-zigbuild
      - name: worker-build
        if: steps.programs.outputs.cache-hit != 'true'
        run: cargo install --locked worker-build
      - name: Build
        if: steps.programs.outputs.cache-hit != 'true'
        run: ./build.sh
      # (Kept at once: the Rust cache's own cleanup, at the job's end, takes what was built for other targets out of
      # target/.)
      - uses: actions/cache/save@v4
        if: steps.programs.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PROGRAMS }}
          key: ${{ steps.key.outputs.programs }}
      - name: The tests, listed and dealt into shards
        if: inputs.tests != 'all'
        id: deal
        run: |
          if [ "${{ inputs.tests }}" = e2e ]; then set -- --test '*'; else set -- --test browser; fi
          cargo test -p superci "$@" -- --list --format terse | sed -n 's/: test$//p' | sort -u > tests.txt
          wc -l < tests.txt
          # (Dealt in turn, in an order that mixes the suites' long and short tests, the same for the same names.)
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import hashlib, json
          names = sorted(open("tests.txt").read().split(), key=lambda n: hashlib.sha256(n.encode()).hexdigest())
          shards = [{"shard": i + 1, "tests": " ".join(names[i::8])} for i in range(8)]
          print("shards=" + json.dumps(shards))
          EOF

      # (Every test of every crate by its name, the sweeps apart: each part runs every test program, with its own names,
      # so that every part measures the same code; dealt as the end-to-end suites are.)
      - name: Every test, listed and dealt into six parts
        if: inputs.tests == 'all'
        id: deal-all
        run: |
          cargo test --workspace -- --list --format terse 2>/dev/null | sed -n 's/: test$//p' | sort -u > tests.txt
          wc -l < tests.txt
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import hashlib, json
          names = open("tests.txt").read().split()
          sweeps = sorted(n for n in names if "holds_with_each_call_and_store_operation_failing" in n or "hold_with_each_call_and_store_operation_failing" in n)
          rest = sorted((n for n in names if n not in sweeps), key=lambda n: hashlib.sha256(n.encode()).hexdigest())
          parts = [{"part": i + 1, "tests": " ".join(rest[i::6]), "sweeps": " ".join(sweeps)} for i in range(6)]
          print("parts=" + json.dumps(parts))
          EOF

  shard:
    needs: prepare
    if: inputs.tests != 'all'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # (One shard keeps the Rust cache; the others read it.)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-shard
          save-if: ${{ matrix.shard == 1 }}
      # (After the Rust cache: restoring it takes away what else is in its target folder.)
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROGRAMS }}
          key: ${{ needs.prepare.outputs.programs }}
          fail-on-cache-miss: true
      - name: Shard ${{ matrix.shard }} of the tests, measured
        env:
          SUPERCI_BUILT: ${{ github.workspace }}
          # (A page waits longer under a coverage run, a few at a time.)
          SUPERCI_BROWSER_WAIT_S: "120"
          TESTS: ${{ matrix.tests }}
          # (SuperCI's own code: the test kit the suites run on is not what they test.)
          SUPERCOV_SOURCE_ROOTS: crates/cli/src,crates/core/src
          SUPERCI_SWEEP_FAULTS: "1"
        run: |
          # (Its tests skip themselves where there is no Chrome: a measure of skipped tests would say nothing.)
          google-chrome --version || { echo "No Chrome on this runner: the browser suite would skip itself." >&2; exit 1; }
          if [ "${{ inputs.tests }}" = e2e ]; then set -- --test '*'; else set -- --test browser; fi
          # shellcheck disable=SC2086
          npx -y supercov@4.20.3 -- cargo test -p superci --no-fail-fast "$@" -- --test-threads=4 --exact $TESTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .supercov/runs
          include-hidden-files: true

  # Every test of every crate, in six parts side by side: each its share of the tests (dealt by name) and its sixth of
  # every sweep's faults, one run merged with the others'. Ubuntu 26.04, as SuperCI's machines that keep Docker's
  # images: its kernel mounts EROFS files, so the layer store's setup is measured switching Docker over.
  all:
    needs: prepare
    if: inputs.tests == 'all'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.parts) }}
    env:
      SUPERCI_BUILT: ${{ github.workspace }}
      # (superci-layers' end-to-end suite in a privileged container, measured with the rest.)
      SUPERCI_LAYERS_E2E: "1"
      IMAGES: mirror.gcr.io/library
      SUPERCI_BROWSER_WAIT_S: "120"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-all
          save-if: ${{ matrix.part == 1 }}
      # (After the Rust cache: restoring it takes away what else is in its target folder.)
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROGRAMS }}
          key: ${{ needs.prepare.outputs.programs }}
          fail-on-cache-miss: true
      # (The Cloudflare Workers' tests, measured: each Worker built again from supercov's copy of its source, with
      # worker-build, and run by the wrangler on PATH, which supercov reads it through.)
      - uses: taiki-e/install-action@v2
        with:
          tool: worker-build
      - name: wrangler
        run: npm install -g wrangler@4.149.0
      - name: The kernel's EROFS (the layer store's setup test mounts its files from a container, which loads no module)
        run: |
          uname -r
          grep -E 'CONFIG_EROFS_FS(=|_BACKED_BY_FILE|_ONDEMAND)' "/boot/config-$(uname -r)" || true
          sudo modprobe erofs && grep erofs /proc/filesystems
      # (Public resolvers for the runner and Docker's containers and builds: GitHub's Ubuntu runners could not resolve
      # Ubuntu's archive through their own, 2026-11-11. Kept beside what the runner sets.)
      - name: Public resolvers
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null
          sudo systemctl restart systemd-resolved
          sudo mkdir -p /etc/docker && { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } | jq '. + {"dns": ["1.1.1.1", "8.8.8.8"]}' | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json && sudo systemctl restart docker
      # (The layer store's tests make EROFS files as the converter does, and serve them as root; containerd's own suites
      # are run against it with Go.)
      - name: mkfs.erofs
        run: sudo apt-get install -y -qq erofs-utils >/dev/null
      - uses: actions/setup-go@v6
        with:
          go-version-file: crates/layers/conformance/go.mod
          cache-dependency-path: crates/layers/conformance/go.sum
      # (One run: its share of the tests and its sixth of every sweep's faults together. The faults change nothing for
      # the other tests, and a run of the sweeps alone would leave out what only some tests build.)
      - name: Part ${{ matrix.part }} of the tests and slice ${{ matrix.part }} of every sweep's faults, measured
        env:
          TESTS: ${{ matrix.tests }}
          SWEEPS: ${{ matrix.sweeps }}
          SUPERCI_SWEEP_FAULTS: "1"
          SUPERCI_SWEEP_SLICE: ${{ matrix.part }}/6
          SUPERCI_BUILT: ${{ github.workspace }}
        # shellcheck disable=SC2086
        run: npx -y supercov@4.20.3 -- cargo test --workspace --no-fail-fast -- --test-threads=4 --exact $TESTS $SWEEPS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shard-${{ matrix.part }}
          path: .supercov/runs
          include-hidden-files: true

  # The shards' runs, as one: what the tests reach, and each file's conditions still to show.
  merge:
    needs: [shard, all]
    # (Also when a shard was cut off at its time limit: the others' runs, merged, still say what they reach.)
    if: ${{ always() && (needs.shard.result != 'skipped' || needs.all.result != 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: .supercov/runs
          merge-multiple: true
      - name: The shards' runs merged
        run: npx -y supercov@4.20.3 merge
      - name: What the tests reach
        run: .github/coverage-gaps.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .supercov/runs
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaps
          path: gaps
