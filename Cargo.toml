[workspace]
resolver = "2"
members = ["crates/core", "crates/plane-cloudflare", "crates/plane-aws", "crates/plane-modal", "crates/runners-cloudflare", "crates/cli", "crates/image-reader"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/supercorp-ai/superci"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
getrandom = { version = "0.2", features = ["js"] }
async-trait = "0.1"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
