[workspace]
resolver = "2"
members = ["crates/core", "crates/plane-cloudflare", "crates/plane-aws", "crates/plane-modal", "crates/runners-cloudflare", "crates/cli", "crates/image-reader", "crates/cache", "crates/testkit", "crates/layers", "crates/programs-planes", "crates/programs-cache", "crates/programs-layers"]

[workspace.package]
version = "0.20.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/supercorp-ai/superci"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
getrandom = { version = "0.2", features = ["js"] }
async-trait = "0.1"
url = "2"
yaml-rust2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The RSA key each run's runner is given is made by these: unoptimized (tests, and coverage runs, build them so) a
# key takes seconds, and every job of a run from a computer makes one. Their code is not this repository's, nor
# measured.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
# And these hash and unpack a control plane's code as it is uploaded (megabytes each deploy): unoptimized, a deploy
# the tests sweep takes seconds of it.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
