[package]
name = "superci-plane-cloudflare"
description = "A SuperCI control plane on Cloudflare: one Worker and one Durable Object in the user's own account"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# (rlib too, so this crate's own tests run: worker-build still takes the cdylib.)
crate-type = ["cdylib", "rlib"]

[dependencies]
superci-core = { path = "../core" }
worker = "0.8"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
async-trait.workspace = true
serde_json.workspace = true
getrandom.workspace = true

[dev-dependencies]
superci-testkit = { path = "../testkit" }
libc = "0.2"
base64.workspace = true
