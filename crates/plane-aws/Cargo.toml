[package]
name = "superci-plane-aws"
description = "A SuperCI control plane on AWS: one Lambda function (with its URL), one DynamoDB table and a schedule, in the user's own account"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
superci-core = { path = "../core" }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
async-trait.workspace = true
serde_json.workspace = true
base64.workspace = true
futures = { version = "0.3", default-features = false, features = ["executor"] }
